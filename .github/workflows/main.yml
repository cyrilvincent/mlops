name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{env.PYTHON_VERSION}}
          cache: pip
          cache-dependency-path: |
            ./requirements.txt
            ./requirements-tf.txt
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-tf.txt
      - run: python -m unittest services_tests -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{env.PYTHON_VERSION}}
          cache: pip
          cache-dependency-path: |
            ./requirements.txt
            ./requirements-tf.txt
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-tf.txt
      - run: python -m unittest api_tests -v
      - run: python -m unittest api_tf_tests -v

  build-docker:
    needs: integration-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sklearn-api
            dockerfile: Dockerfile.api
          - name: tf-api
            dockerfile: Dockerfile.tf
          - name: nginx
            dockerfile: Dockerfile.nginx
          - name: wsgi
            dockerfile: Dockerfile.wsgi
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}



